# The proxy's route allowlist leaves the native route out, so Python refuses the request itself.
config:
  model_list:
    - model_name: claude
      litellm_params:
        model: anthropic/claude-haiku-5-5
        api_key: provider-key
  general_settings:
    master_key: gateway-key
    allowed_routes: [/health, /v1/chat/completions]

requests:
  - name: unlisted route
    headers: {authorization: Bearer gateway-key}
    body: {model: claude, max_tokens: 16, messages: []}
    expect: python
    reason: route
    over: general_settings.allowed_routes

  - name: listed route the native app does not serve
    path: /v1/chat/completions
    expect: python
    reason: route
    over: unserved_route
